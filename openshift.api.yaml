apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: uncsg-updates-api
  labels:
    app: uncsg-updates-api
    app.kubernetes.io/part-of: uncsg-github-io-app
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: uncsg-updates-api
  labels:
    app: uncsg-updates-api
    app.kubernetes.io/part-of: uncsg-github-io-app
spec:
  source:
    type: Git
    git:
      uri: https://github.com/WillieTheWhale/UNCSG.github.io.git
      ref: main
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile.api
  output:
    to:
      kind: ImageStreamTag
      name: uncsg-updates-api:latest
  triggers:
    - type: ConfigChange
    - type: GitHub
      github:
        secretReference:
          name: uncsg-updates-api-webhook-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uncsg-updates-api
  labels:
    app: uncsg-updates-api
    app.kubernetes.io/part-of: uncsg-github-io-app
  annotations:
    image.openshift.io/triggers: >-
      [{"from":{"kind":"ImageStreamTag","name":"uncsg-updates-api:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"uncsg-updates-api\")].image"}]
spec:
  replicas: 1
  # The namespace quota cannot reserve two API pods during a rolling update.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: uncsg-updates-api
  template:
    metadata:
      labels:
        app: uncsg-updates-api
        app.kubernetes.io/part-of: uncsg-github-io-app
    spec:
      containers:
        - name: uncsg-updates-api
          image: uncsg-updates-api:latest
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: API_PORT
              value: "8080"
            - name: PUBLIC_BASE_URL
              value: https://executivebranch.unc.edu
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: uncsg-updates-secrets
                  key: database-url
            - name: DATABASE_SSL
              value: require
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: uncsg-updates-secrets
                  key: better-auth-secret
            - name: UNC_AUTH_BROKER_URL
              value: https://uncsg-auth-broker-bhilberg.apps.cloudapps.unc.edu
            - name: UNC_AUTH_BROKER_CLIENT_ID
              value: uncsg-updates
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: uncsg-updates-secrets
                  key: resend-api-key
            - name: EMAIL_FROM
              valueFrom:
                secretKeyRef:
                  name: uncsg-updates-secrets
                  key: email-from
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 8
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 25
            periodSeconds: 20
          resources:
            limits:
              memory: 384Mi
              cpu: 300m
            requests:
              memory: 192Mi
              cpu: 75m
---
apiVersion: v1
kind: Service
metadata:
  name: uncsg-updates-api
  labels:
    app: uncsg-updates-api
    app.kubernetes.io/part-of: uncsg-github-io-app
spec:
  selector:
    app: uncsg-updates-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP

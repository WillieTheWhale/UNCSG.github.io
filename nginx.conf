server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;
    error_page 500 502 503 504 /500.html;

    location = /404.html {
        internal;
        expires -1;
    }

    location = /500.html {
        internal;
        expires -1;
    }

    # The updates API requires its own PostgreSQL-backed deployment. Do not make
    # the public static site unavailable while that service is not provisioned:
    # nginx resolves literal proxy hostnames during startup, which otherwise
    # turns a missing optional service into a CrashLoopBackOff for the frontend.
    location /api/ {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "300" always;
        return 503 '{"error":"Updates API is temporarily unavailable."}';
    }

    # Dynamic article slugs use one statically generated client shell.
    location ~ ^/updates/[a-z0-9]+(?:-[a-z0-9]+)*/?$ {
        try_files /updates/article/index.html =404;
        expires -1;
    }

    location ~ ^/preview-updates/[a-z0-9]+(?:-[a-z0-9]+)*/?$ {
        try_files /preview-updates/article/index.html =404;
        expires -1;
    }

    location ~ ^/events/[a-z0-9]+(?:-[a-z0-9]+)*/?$ {
        try_files /events/article/index.html =404;
        expires -1;
    }

    location ~ ^/preview-events/[a-z0-9]+(?:-[a-z0-9]+)*/?$ {
        try_files /preview-events/article/index.html =404;
        expires -1;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
        expires -1;
    }

    # Astro fingerprints generated assets, so they can be cached immutably.
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp|avif|woff|woff2)$ {
        try_files $uri =404;
        expires 1y;
        access_log off;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'self'; frame-src https://www.instagram.com; img-src 'self' data: https://unc.edu; object-src 'none'; script-src 'self' https://unc.edu https://www.instagram.com; style-src 'self' https://unc.edu" always;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Every route intentionally resolves to the construction page until launch.
    location / {
        try_files $uri $uri/ $uri.html /index.html;
        expires -1;
    }

    # Astro fingerprints generated assets, so they can be cached immutably.
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp|avif|woff|woff2)$ {
        try_files $uri =404;
        expires 1y;
        access_log off;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; font-src 'self'; form-action 'none'; frame-ancestors 'self'; img-src 'self' data: https://unc.edu; object-src 'none'; script-src 'self' https://unc.edu; style-src 'self' https://unc.edu" always;
}

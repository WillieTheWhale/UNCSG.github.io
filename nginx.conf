server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Keep the static Astro frontend and updates API on one origin.
    location /api/ {
        proxy_pass http://uncsg-updates-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_request_buffering on;
        client_max_body_size 6m;
        expires -1;
    }

    # Dynamic article slugs use one statically generated client shell.
    location ~ ^/updates/[^/]+/?$ {
        try_files /updates/article/index.html =404;
        expires -1;
    }

    location ~ ^/preview-updates/[^/]+/?$ {
        try_files /preview-updates/article/index.html =404;
        expires -1;
    }

    location / {
        try_files $uri $uri/ $uri.html /index.html;
        expires -1;
    }

    # Astro fingerprints generated assets, so they can be cached immutably.
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp|avif|woff|woff2)$ {
        try_files $uri =404;
        expires 1y;
        access_log off;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'self'; img-src 'self' data: https://unc.edu; object-src 'none'; script-src 'self' https://unc.edu; style-src 'self' https://unc.edu" always;
}

apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: uncsg-website
  labels:
    app: uncsg-website
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: uncsg-website
  labels:
    app: uncsg-website
spec:
  source:
    type: Git
    git:
      uri: https://github.com/WillieTheWhale/UNCSG.github.io.git
      ref: main
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: uncsg-website:latest
  triggers:
    - type: ConfigChange
    - type: GitHub
      github:
        secretReference:
          name: uncsg-webhook-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uncsg-website
  labels:
    app: uncsg-website
  annotations:
    image.openshift.io/triggers: >-
      [{"from":{"kind":"ImageStreamTag","name":"uncsg-website:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"uncsg-website\")].image"}]
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uncsg-website
  template:
    metadata:
      labels:
        app: uncsg-website
    spec:
      containers:
        - name: uncsg-website
          image: uncsg-website:latest
          ports:
            - containerPort: 8080
              protocol: TCP
          resources:
            limits:
              memory: 128Mi
              cpu: 100m
            requests:
              memory: 64Mi
              cpu: 60m
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: uncsg-updates-api
  labels:
    app: uncsg-updates-api
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: uncsg-updates-api
  labels:
    app: uncsg-updates-api
spec:
  source:
    type: Git
    git:
      uri: https://github.com/WillieTheWhale/UNCSG.github.io.git
      ref: main
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile.api
  output:
    to:
      kind: ImageStreamTag
      name: uncsg-updates-api:latest
  triggers:
    - type: ConfigChange
    - type: GitHub
      github:
        secretReference:
          name: uncsg-webhook-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uncsg-updates-api
  labels:
    app: uncsg-updates-api
  annotations:
    image.openshift.io/triggers: >-
      [{"from":{"kind":"ImageStreamTag","name":"uncsg-updates-api:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"uncsg-updates-api\")].image"}]
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uncsg-updates-api
  template:
    metadata:
      labels:
        app: uncsg-updates-api
    spec:
      containers:
        - name: uncsg-updates-api
          image: uncsg-updates-api:latest
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: API_PORT
              value: "8080"
            - name: PUBLIC_BASE_URL
              value: https://executivebranch.unc.edu
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: uncsg-updates-secrets
                  key: database-url
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: uncsg-updates-secrets
                  key: better-auth-secret
            - name: UNC_AUTH_BROKER_URL
              value: https://uncsg-auth-broker-bhilberg.apps.cloudapps.unc.edu
            - name: UNC_AUTH_BROKER_CLIENT_ID
              value: uncsg-updates
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: uncsg-updates-secrets
                  key: resend-api-key
            - name: EMAIL_FROM
              valueFrom:
                secretKeyRef:
                  name: uncsg-updates-secrets
                  key: email-from
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 8
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 25
            periodSeconds: 20
          resources:
            limits:
              memory: 384Mi
              cpu: 300m
            requests:
              memory: 192Mi
              cpu: 75m
---
apiVersion: v1
kind: Service
metadata:
  name: uncsg-updates-api
  labels:
    app: uncsg-updates-api
spec:
  selector:
    app: uncsg-updates-api
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uncsg-updates-postgres
  labels:
    app: uncsg-updates-postgres
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uncsg-updates-postgres
  labels:
    app: uncsg-updates-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: uncsg-updates-postgres
  template:
    metadata:
      labels:
        app: uncsg-updates-postgres
    spec:
      containers:
        - name: postgres
          image: quay.io/sclorg/postgresql-16-c9s:latest
          ports:
            - containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRESQL_USER
              value: uncsg
            - name: POSTGRESQL_DATABASE
              value: uncsg_updates
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: uncsg-updates-secrets
                  key: postgres-password
          volumeMounts:
            - name: database
              mountPath: /var/lib/pgsql/data
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U uncsg -d uncsg_updates
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            limits:
              memory: 512Mi
              cpu: 400m
            requests:
              memory: 256Mi
              cpu: 100m
      volumes:
        - name: database
          persistentVolumeClaim:
            claimName: uncsg-updates-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: uncsg-updates-postgres
  labels:
    app: uncsg-updates-postgres
spec:
  selector:
    app: uncsg-updates-postgres
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: uncsg-website
  labels:
    app: uncsg-website
spec:
  selector:
    app: uncsg-website
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: uncsg-website
  labels:
    app: uncsg-website
spec:
  to:
    kind: Service
    name: uncsg-website
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
